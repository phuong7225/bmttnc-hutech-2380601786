<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Caesar Cipher</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2933;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(720px, 100%);
            background: #ffffff;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 5vw, 44px);
            line-height: 1.05;
            color: #102a43;
        }

        p {
            margin: 0 0 28px;
            line-height: 1.6;
            color: #52606d;
        }

        a {
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            padding: 0 18px;
            border-radius: 6px;
            background: #0b7285;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
        }

        a:focus,
        a:hover {
            background: #095c6b;
        }
    </style>
</head>
<body>
    <main>
        <h1>Caesar Cipher</h1>
        <p>Encrypt and decrypt text with a numeric shift key.</p>
        <a href="{{ url_for('caesar') }}">Open Demo</a>
    </main>
</body>
</html>
